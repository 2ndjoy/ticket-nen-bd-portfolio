name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npm ci --prefix client
      - run: npm test --prefix client -- --watchAll=false --runInBand
      - run: npm run build --prefix client
      - run: npm ci --prefix e2e
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: e2e
      - name: Start the demo and run browser tests
        run: |
          node server/server.js > "$RUNNER_TEMP/ticketnen.log" 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5000/api/health
          npm test --prefix e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
